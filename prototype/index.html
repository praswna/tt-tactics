<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TT Tactics 전술 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 코치의 전술 보드(탑뷰, 데스크톱에서 sticky) 왼쪽 + 구별 설명 카드 오른쪽. 폰에서는 한 열로 쌓인다. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #171d26;
  --muted: #5d6878;
  --line: #d5dbe3;
  --board: #e2e7ed;
  --grid: #ccd3dc;
  --table: #2a5ea8;
  --table-line: #ffffff;
  --net: #2b3440;
  --zone: rgba(255, 255, 255, 0.38);
  --me: #d64438;
  --me-ink: #ffffff;
  --opp: #2b313a;
  --opp-ink: #ffffff;
  --ball: #f4a622;
  --accent: #2a5ea8;
  --accent-ink: #ffffff;
  --focus: #f4a622;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418; --surface: #181d24; --fg: #e6eaef; --muted: #98a3b3; --line: #2a323d;
    --board: #0b0e12; --grid: #1c232c; --table: #1e4d92; --table-line: #dfe6ef; --net: #aab4c2;
    --zone: rgba(255, 255, 255, 0.22); --me: #ef6a5e; --me-ink: #ffffff; --opp: #d2d9e2; --opp-ink: #0b0e12;
    --ball: #f7b43c; --accent: #5b8fd9; --accent-ink: #0b0e12; --focus: #f7b43c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418; --surface: #181d24; --fg: #e6eaef; --muted: #98a3b3; --line: #2a323d;
  --board: #0b0e12; --grid: #1c232c; --table: #1e4d92; --table-line: #dfe6ef; --net: #aab4c2;
  --zone: rgba(255, 255, 255, 0.22); --me: #ef6a5e; --me-ink: #ffffff; --opp: #d2d9e2; --opp-ink: #0b0e12;
  --ball: #f7b43c; --accent: #5b8fd9; --accent-ink: #0b0e12; --focus: #f7b43c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, select { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { max-width: 1180px; margin: 0 auto; padding-block: 18px 14px; display: grid; gap: 6px; }
.brand { font-family: var(--font-display); letter-spacing: 0.1em; font-size: 13px; color: var(--muted); }
.brand span { font-family: var(--font-body); letter-spacing: 0; margin-left: 8px; font-size: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); }

.layout { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 880px) {
  .layout { grid-template-columns: minmax(300px, 480px) minmax(0, 1fr); align-items: start; }
  .board-wrap { position: sticky; top: 12px; }
}
.board-wrap { min-width: 0; display: grid; gap: 8px; }
.board { width: 100%; height: auto; max-height: calc(100vh - 150px); display: block; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); padding-inline: 2px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
.legend .ln { display: inline-block; width: 16px; height: 0; border-top: 2px dashed var(--muted); vertical-align: 3px; margin-right: 5px; }

.panel { min-width: 0; display: grid; gap: 12px; }
.stepper { display: flex; flex-wrap: wrap; gap: 6px; }
.step-btn {
  font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.step-btn b { font-family: var(--font-display); font-weight: 400; font-size: 14px; }
.step-btn .dot { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.step-btn[aria-current="step"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step-btn[aria-current="step"] .dot { outline: 1.5px solid var(--accent-ink); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 92px; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: 0.45; cursor: default; }
.controls select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.controls .spacer { flex: 1; }
.kbd { font-size: 11px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 14px; }
.card-head { display: flex; gap: 14px; align-items: flex-start; }
.num { font-family: var(--font-display); font-size: 46px; line-height: 0.9; min-width: 58px; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num.wide { font-size: 30px; line-height: 1.1; }
.head-text { display: grid; gap: 6px; min-width: 0; }
.actor { font-size: 11px; padding: 2px 8px; border-radius: 999px; width: max-content; letter-spacing: 0.04em; }
.actor.me { background: var(--me); color: var(--me-ink); }
.actor.opp { background: var(--opp); color: var(--opp-ink); }
.title { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.35; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 14px; margin: 0; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts dt { color: var(--muted); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
.facts dd { margin: 0; font-weight: 500; font-size: 13px; }
.sec h3 { font-size: 11.5px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 4px; font-weight: 600; }
.sec p { margin: 0; max-width: 62ch; }
.sec ul, .sec ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 62ch; }
.branch { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.branch h3 { font-size: 11.5px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; font-weight: 600; }
.branch-opts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.branch-btn {
  text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center;
}
.branch-btn b { font-family: var(--font-display); font-weight: 400; font-size: 20px; grid-row: span 2; color: var(--muted); }
.branch-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.branch-btn[aria-pressed="true"] b { color: var(--accent); }
.branch-btn small { color: var(--muted); font-size: 12px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.steps button {
  width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  display: flex; gap: 10px; align-items: baseline;
}
.steps button b { font-family: var(--font-display); font-weight: 400; font-size: 15px; min-width: 28px; }
.steps button .who { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
.who.me { background: var(--me); color: var(--me-ink); } .who.opp { background: var(--opp); color: var(--opp-ink); }
details { font-size: 12.5px; color: var(--muted); }
details summary { cursor: pointer; }
details pre { margin: 8px 0 0; padding: 10px; background: var(--bg); border-radius: 6px; overflow-x: auto; font-size: 11.5px; line-height: 1.45; color: var(--fg); }

.foot { max-width: 1180px; margin: 28px auto 0; color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; }
.foot code { font-size: 11.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* ---- SVG 보드 ---- */
.board text { font-family: var(--font-body); }
.board .floor { fill: var(--board); }
.board .grid { stroke: var(--grid); stroke-width: 0.6; }
.board .table { fill: var(--table); stroke: var(--table-line); stroke-width: 2; }
.board .zone { stroke: var(--zone); stroke-width: 0.8; stroke-dasharray: 3 3; fill: none; }
.board .center { stroke: var(--table-line); stroke-width: 1; }
.board .net { stroke: var(--net); stroke-width: 3; }
.board .post { fill: var(--net); }
.board .lbl { fill: var(--muted); font-size: 7.5px; letter-spacing: 0.04em; text-anchor: middle; }
.board .lbl.small { font-size: 6.5px; }
.board .lbl.start { text-anchor: start; }
.board .scale { stroke: var(--muted); stroke-width: 1; }
.board .shot { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.board .me .shot, .board .me .foot-arrow, .board .me .racket-line, .board .me .ring, .board .me .ghost { stroke: var(--me); }
.board .opp .shot, .board .opp .foot-arrow, .board .opp .racket-line, .board .opp .ring, .board .opp .ghost { stroke: var(--opp); }
.board .me .racket-head, .board .me .numb circle, .board .me .arrowhead { fill: var(--me); }
.board .opp .racket-head, .board .opp .numb circle, .board .opp .arrowhead { fill: var(--opp); }
.board .me .numb text { fill: var(--me-ink); } .board .opp .numb text { fill: var(--opp-ink); }
.board .me .stroke-label { fill: var(--me); }
.board .opp .stroke-label { fill: var(--opp); }
.board .foot-arrow { fill: none; stroke-width: 1.6; stroke-dasharray: 4 3; }
.board .ghost { fill: none; stroke-dasharray: 2 2; stroke-width: 1.2; opacity: 0.8; }
.board .racket-line { stroke-width: 2; }
.board .racket-head { stroke: var(--surface); stroke-width: 1; }
.board .ring { fill: none; stroke-width: 1.5; }
.board .ring-dot { fill: var(--surface); }
.board .ball { fill: var(--ball); stroke: rgba(0, 0, 0, 0.3); stroke-width: 0.6; }
.board .history { opacity: 0.26; }
.board .badge rect { fill: var(--surface); stroke: var(--line); stroke-width: 0.8; }
.board .badge text { font-size: 8px; fill: var(--fg); text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
.board .stroke-label { font-size: 7.5px; text-anchor: middle; font-weight: 500; }
.board .numb circle { stroke: var(--surface); stroke-width: 1.2; }
.board .numb text { font-family: var(--font-display); font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
.board .player .body { stroke: var(--surface); stroke-width: 1.5; }
.board .player.me .body { fill: var(--me); } .board .player.opp .body { fill: var(--opp); }
.board .player text { font-size: 9px; font-weight: 600; text-anchor: middle; }
.board .player.me text { fill: var(--me-ink); } .board .player.opp text { fill: var(--opp-ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

</main>

<script>
(function () {
  'use strict';

  // ---------- 데이터 ----------
  const TACTIC = JSON.parse(document.getElementById('tactic-data').textContent);

  // ---------- 좌표계 ----------
  // 미터 → px. 100px = 1m. 원점(테이블 중심)은 (210, 310). 화면 위가 상대, 아래가 나.
  const S = 100, W = 420, H = 620, CX = 210, CY = 310;
  // 보이는 영역: 선수가 서는 범위(좌우 ±1.8m, 앞뒤 ±2.3m)만 잘라 보여준다
  const VB = { x: 30, y: 80, w: 360, h: 475 };
  const TW = 1.525 * S, TL = 2.74 * S;
  const TX = CX - TW / 2, TY = CY - TL / 2;
  const px = (p) => ({ x: CX + p.x * S, y: CY - p.y * S });
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const NS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, str, cls) {
    const t = el('text', { x, y, class: cls || '' }, parent);
    t.textContent = str;
    return t;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  const svg = document.getElementById('board');
  svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
  const layers = {};
  ['floor', 'history', 'current', 'players'].forEach((n) => { layers[n] = el('g', { id: 'L-' + n }, svg); });

  // ---------- 고정 배경: 바닥, 테이블, 존, 라벨 ----------
  function drawFloor() {
    const g = layers.floor;
    el('rect', { x: 0, y: 0, width: W, height: H, rx: 8, class: 'floor' }, g);
    for (let x = CX % 50; x <= W; x += 50) el('line', { x1: x, y1: 0, x2: x, y2: H, class: 'grid' }, g);
    for (let y = CY % 50; y <= H; y += 50) el('line', { x1: 0, y1: y, x2: W, y2: y, class: 'grid' }, g);

    el('rect', { x: TX, y: TY, width: TW, height: TL, class: 'table' }, g);
    [TW / 3, (2 * TW) / 3].forEach((dx) => el('line', { x1: TX + dx, y1: TY, x2: TX + dx, y2: TY + TL, class: 'zone' }, g));
    [1, 2, 4, 5].forEach((k) => { const y = TY + (TL * k) / 6; el('line', { x1: TX, y1: y, x2: TX + TW, y2: y, class: 'zone' }, g); });
    el('line', { x1: CX, y1: TY, x2: CX, y2: TY + TL, class: 'center' }, g);
    el('line', { x1: TX - 15.25, y1: CY, x2: TX + TW + 15.25, y2: CY, class: 'net' }, g);
    el('rect', { x: TX - 17, y: CY - 3, width: 3.5, height: 6, class: 'post' }, g);
    el('rect', { x: TX + TW + 13.5, y: CY - 3, width: 3.5, height: 6, class: 'post' }, g);

    // 코스 라벨: 상대(위)는 마주 보고 있으므로 FH가 화면 왼쪽
    const sixth = TW / 6;
    txt(g, TX + sixth, TY - 6, 'FH', 'lbl'); txt(g, CX, TY - 6, '미들', 'lbl'); txt(g, TX + 5 * sixth, TY - 6, 'BH', 'lbl');
    txt(g, TX + sixth, TY + TL + 11, 'BH', 'lbl'); txt(g, CX, TY + TL + 11, '미들', 'lbl'); txt(g, TX + 5 * sixth, TY + TL + 11, 'FH', 'lbl');
    txt(g, TX + TW + 26, TY - 6, '상대 코트', 'lbl small');
    txt(g, TX + TW + 24, TY + TL + 11, '내 코트', 'lbl small');
    // 길이 라벨(오른쪽)
    const lx = TX + TW + 6;
    [['롱', 1], ['하프롱', 3], ['쇼트', 5], ['쇼트', 7], ['하프롱', 9], ['롱', 11]].forEach(([s, k]) => txt(g, lx, TY + (TL * k) / 12 + 2.5, s, 'lbl small start'));
    txt(g, TX - 6, CY + 2.5, '네트', 'lbl small').setAttribute('text-anchor', 'end');
    // 치수와 스케일 바
    txt(g, TX + 3, TY + TL - 4, '2.74 × 1.525 m', 'lbl small').setAttribute('text-anchor', 'start');
    g.lastChild.style.fill = 'var(--zone)';
    const sx = VB.x + 14, sy = VB.y + VB.h - 14;
    el('line', { x1: sx, y1: sy, x2: sx + S, y2: sy, class: 'scale' }, g);
    el('line', { x1: sx, y1: sy - 4, x2: sx, y2: sy + 4, class: 'scale' }, g);
    el('line', { x1: sx + S, y1: sy - 4, x2: sx + S, y2: sy + 4, class: 'scale' }, g);
    txt(g, sx + S / 2, sy - 5, '1 m', 'lbl small');
  }

  // ---------- 선수 마커 ----------
  const players = {};
  function makePlayer(key, label) {
    const g = el('g', { class: 'player ' + key }, layers.players);
    el('circle', { r: 12, class: 'body' }, g);
    txt(g, 0, 3.4, label);
    players[key] = { g, pos: Object.assign({}, TACTIC.start[key]) };
  }
  function placePlayer(key, pt) {
    const q = px(pt);
    players[key].g.setAttribute('transform', `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)})`);
    players[key].pos = pt;
  }

  // ---------- 시퀀스(분기 반영) ----------
  const byId = Object.fromEntries(TACTIC.shots.map((s) => [s.id, s]));
  function buildSeq(key) {
    const seq = [];
    let cur = byId[TACTIC.root];
    while (cur) {
      seq.push(cur);
      const nx = cur.next;
      if (!nx) break;
      if (typeof nx === 'string') cur = byId[nx];
      else { const b = nx.branches.find((x) => x.key === key) || nx.branches[0]; cur = byId[b.next]; }
    }
    return seq;
  }
  function branchNode(seq) { return seq.find((s) => s.next && s.next.branches); }
  function posBefore(seq, i) {
    const p = { me: Object.assign({}, TACTIC.start.me), opp: Object.assign({}, TACTIC.start.opp) };
    for (let k = 0; k < i; k++) p[seq[k].actor] = seq[k].body;
    return p;
  }

  // ---------- 경로 기하 ----------
  function shotPoints(seq, k) {
    const s = seq[k];
    const pts = [s.contact].concat(s.bounces);
    const nxt = seq[k + 1];
    if (nxt) pts.push(nxt.contact);
    else {
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
      pts.push({ x: b.x + (dx / L) * 0.35, y: b.y + (dy / L) * 0.35 });
    }
    return pts.map(px);
  }
  // 손으로 그린 화살표처럼 아주 살짝 휘게. 방향이 반대인 두 크로스 코스가 서로 다른 쪽으로 휘어 겹치지 않는다.
  function pathD(P) {
    let d = `M${P[0].x.toFixed(1)} ${P[0].y.toFixed(1)}`;
    for (let i = 1; i < P.length; i++) {
      const a = P[i - 1], b = P[i];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, k = 0.05 * L;
      const cx = (a.x + b.x) / 2 + (-dy / L) * k, cy = (a.y + b.y) / 2 + (dx / L) * k;
      d += ` Q${cx.toFixed(1)} ${cy.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
    }
    return d;
  }
  function measure(d) {
    const p = el('path', { d, fill: 'none', stroke: 'none' }, svg);
    const L = p.getTotalLength();
    svg.removeChild(p);
    return L;
  }
  function spinGlyph(spins) {
    const g = { '하회전': '↓', '상회전': '↑', '너클': '○', '횡회전': '↔', '횡하회전': '↙', '횡상회전': '↗' };
    return spins.map((s) => g[s] || '').filter(Boolean).join('');
  }
  function clampX(x, w) { return Math.min(VB.x + VB.w - w / 2 - 4, Math.max(VB.x + w / 2 + 4, x)); }
  // 2차 베지어 위의 점
  function qpoint(a, c, b, t) {
    const u = 1 - t;
    return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y };
  }

  // 배경 사각형이 있는 작은 라벨. 글자 폭을 측정해 사각형 크기를 정한다.
  function badge(parent, x, y, str, cls) {
    const g = el('g', { class: 'badge ' + (cls || '') }, parent);
    const t = txt(g, 0, 0, str);
    const w = t.getComputedTextLength() + 10;
    const r = el('rect', { x: -w / 2, y: -7.5, width: w, height: 15, rx: 7.5 }, g);
    g.insertBefore(r, t);
    g.setAttribute('transform', `translate(${clampX(x, w).toFixed(1)} ${y.toFixed(1)})`);
    return g;
  }

  // ---------- 한 구 그리기 ----------
  // 반환: 애니메이션 핸들. final=true면 최종 상태로 바로 그린다.
  function drawShot(seq, k, parent, opts) {
    const s = seq[k];
    const g = el('g', { class: 'shot-group ' + s.actor }, parent);
    const before = posBefore(seq, k);
    const bodyPx = px(s.body), contactPx = px(s.contact);
    const H_ = {};

    // 풋워크: 이전 위치(고스트) → 몸 위치 점선 화살표. 이름은 아래 스트로크 라벨에 함께 적는다.
    if (s.footwork) {
      const from = px(before[s.actor]), to = bodyPx;
      const dx = to.x - from.x, dy = to.y - from.y, L = Math.hypot(dx, dy) || 1;
      const a = { x: from.x + (dx / L) * 14, y: from.y + (dy / L) * 14 };
      const b = { x: to.x - (dx / L) * 16, y: to.y - (dy / L) * 16 };
      const fg = el('g', { class: 'foot' }, g);
      el('circle', { cx: from.x, cy: from.y, r: 12, class: 'ghost' }, fg);
      const seg = Math.hypot(b.x - a.x, b.y - a.y);
      const fa = el('path', { d: `M${a.x} ${a.y} L${b.x} ${b.y}`, class: 'foot-arrow' }, fg);
      H_.foot = {
        reveal(t) {
          fa.setAttribute('stroke-dasharray', t >= 1 ? '4 3' : `${seg * t} ${seg}`);
          if (t >= 1) fa.setAttribute('marker-end', `url(#arrow-${s.actor})`);
        }
      };
      if (opts.final) H_.foot.reveal(1);
      else H_.foot.reveal(0);
    }

    // 라켓: 몸 → 임팩트 지점. 그 아래(상대는 위)에 "풋워크 → 스트로크" 라벨
    const rk = el('g', { class: 'racket' }, g);
    el('line', { x1: bodyPx.x, y1: bodyPx.y, x2: contactPx.x, y2: contactPx.y, class: 'racket-line' }, rk);
    const ang = (Math.atan2(contactPx.y - bodyPx.y, contactPx.x - bodyPx.x) * 180) / Math.PI;
    el('ellipse', { cx: contactPx.x, cy: contactPx.y, rx: 5.5, ry: 3.8, transform: `rotate(${ang.toFixed(1)} ${contactPx.x} ${contactPx.y})`, class: 'racket-head' }, rk);
    if (!opts.noLabel) {
      // 같은 자리에서 두 번 치면(전체 보기) 라벨을 한 줄씩 밀어 겹치지 않게
      const slots = opts.slots || {};
      const key = `${s.actor}:${bodyPx.x.toFixed(0)},${bodyPx.y.toFixed(0)}`;
      const n = slots[key] || 0; slots[key] = n + 1;
      const slY = s.actor === 'me' ? bodyPx.y + 25 + n * 11 : bodyPx.y - 20 - n * 11;
      const strokeShort = s.stroke.replace(/\s*\(.*$/, '');
      const sl = txt(rk, bodyPx.x, slY, (s.footwork ? s.footwork.type + ' → ' : '') + strokeShort, 'stroke-label');
      sl.setAttribute('x', clampX(bodyPx.x, sl.getComputedTextLength()));
    }
    rk.style.opacity = opts.final ? 1 : 0;
    H_.racket = { show() { rk.style.opacity = 1; } };

    // 공 궤적
    const P = shotPoints(seq, k);
    const d = pathD(P);
    const path = el('path', { d, class: 'shot' }, g);
    const total = measure(d);
    // 바운드 지점까지의 누적 길이(각 정점까지 부분 경로를 재서 구한다)
    const cum = [0];
    for (let i = 2; i <= P.length; i++) cum.push(measure(pathD(P.slice(0, i))));
    const rings = s.bounces.map((b, i) => {
      const q = px(b);
      const rg = el('g', { class: 'bounce' }, g);
      el('circle', { cx: q.x, cy: q.y, r: 4.6, class: 'ring' }, rg);
      el('circle', { cx: q.x, cy: q.y, r: 1.6, class: 'ring-dot' }, rg);
      return { g: rg, at: cum[i + 1] };
    });
    const ball = el('circle', { r: 4, class: 'ball' }, g);
    ball.hidden = true;

    // 번호와 회전 배지는 가장 긴 구간(네트를 넘는 구간) 위에 놓되,
    // 구 순서대로 위(상대 쪽)에서 아래(내 쪽)로 사다리처럼 높이를 나눠 서로 겹치지 않게 한다.
    let mainI = 1, mainL = 0;
    for (let i = 1; i < P.length; i++) { const L = Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y); if (L > mainL) { mainL = L; mainI = i; } }
    const a = P[mainI - 1], b = P[mainI];
    const nx = -(b.y - a.y) / mainL, ny = (b.x - a.x) / mainL; // 휘는 쪽 법선
    const ctrl = { x: (a.x + b.x) / 2 + nx * 0.05 * mainL, y: (a.y + b.y) / 2 + ny * 0.05 * mainL };
    const ladderY = CY - (0.9 - (1.8 * k) / Math.max(1, seq.length - 1)) * S;
    let tt = Math.abs(b.y - a.y) < 1 ? 0.5 : (ladderY - a.y) / (b.y - a.y);
    tt = Math.min(0.88, Math.max(0.12, tt));
    const m = qpoint(a, ctrl, b, tt);
    const numb = el('g', { class: 'numb', transform: `translate(${m.x.toFixed(1)} ${m.y.toFixed(1)})` }, g);
    el('circle', { r: 7.5 }, numb);
    txt(numb, 0, 0.5, String(s.n));
    const bd = badge(g, m.x - nx * 24, m.y - ny * 24, `${spinGlyph(s.spin)} ${s.spin.join('/')} · ${s.length}`);
    bd.style.opacity = opts.final ? 1 : 0;
    numb.style.opacity = opts.final ? 1 : 0;

    H_.len = total;
    H_.flight = function (t) {
      const L = total * t;
      path.setAttribute('stroke-dasharray', t >= 1 ? 'none' : `${L} ${total}`);
      if (t >= 1) path.setAttribute('marker-end', `url(#arrow-${s.actor})`);
      rings.forEach((r) => { r.g.style.opacity = L >= r.at - 0.5 ? 1 : 0; });
      if (!opts.noBall) {
        const q = path.getPointAtLength(Math.min(L, total));
        let seg = 0; while (seg < cum.length - 2 && L > cum[seg + 1]) seg++;
        const segT = (L - cum[seg]) / Math.max(1, cum[seg + 1] - cum[seg]);
        ball.setAttribute('cx', q.x.toFixed(2)); ball.setAttribute('cy', q.y.toFixed(2));
        ball.setAttribute('r', (3.6 + 2.2 * Math.sin(Math.PI * Math.min(1, Math.max(0, segT)))).toFixed(2));
        ball.hidden = false;
      }
    };
    H_.badge = { show() { bd.style.opacity = 1; numb.style.opacity = 1; } };
    if (opts.final) H_.flight(1); else { H_.flight(0); rings.forEach((r) => { r.g.style.opacity = 0; }); }
    if (opts.noBall) ball.hidden = true;
    return H_;
  }

  // ---------- 상태 ----------
  let branchKey = TACTIC.defaultBranch || 'A';
  let seq = buildSeq(branchKey);
  let idx = 0;
  let overview = false;
  let runId = 0;
  let playing = false;
  const speedSel = document.getElementById('speed');
  const spd = () => parseFloat(speedSel.value);

  function tween(ms, fn) {
    const my = runId;
    return new Promise((res) => {
      if (reduced || ms <= 0) { fn(1); res(true); return; }
      const t0 = performance.now();
      function frame(now) {
        if (my !== runId) { res(false); return; }
        const t = Math.min(1, (now - t0) / ms);
        fn(ease(t));
        if (t < 1) requestAnimationFrame(frame); else res(true);
      }
      requestAnimationFrame(frame);
    });
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));

  // 한 구를 보여준다. animate=true면 풋워크 → 타구 순서로 움직인다.
  async function render(i, animate) {
    const my = ++runId;
    idx = Math.max(0, Math.min(seq.length - 1, i));
    overview = false;
    clear(layers.history); clear(layers.current);
    renderPanel(); renderStepper(); syncButtons();

    const hg = el('g', { class: 'history' }, layers.history);
    for (let k = 0; k < idx; k++) drawShot(seq, k, hg, { final: true, noBall: true, noLabel: true });

    const pb = posBefore(seq, idx);
    placePlayer('me', pb.me); placePlayer('opp', pb.opp);

    const s = seq[idx];
    const parts = drawShot(seq, idx, layers.current, { final: !animate });
    if (!animate) { placePlayer(s.actor, s.body); return true; }

    if (parts.foot) {
      const from = pb[s.actor], to = s.body;
      const ok = await tween(700 * spd(), (t) => { placePlayer(s.actor, lerp(from, to, t)); parts.foot.reveal(t); });
      if (!ok || my !== runId) return false;
      await wait(120 * spd());
      if (my !== runId) return false;
    } else placePlayer(s.actor, s.body);
    parts.racket.show();
    await wait(140 * spd());
    if (my !== runId) return false;
    const ok2 = await tween(Math.max(650, parts.len * 3.4) * spd(), (t) => parts.flight(t));
    if (!ok2 || my !== runId) return false;
    parts.badge.show();
    return true;
  }

  function renderOverview() {
    ++runId; playing = false; overview = true;
    clear(layers.history); clear(layers.current);
    renderPanel(); renderStepper(); syncButtons();
    const slots = {};
    for (let k = 0; k < seq.length; k++) drawShot(seq, k, layers.current, { final: true, noBall: true, slots });
    const pe = posBefore(seq, seq.length);
    placePlayer('me', pe.me); placePlayer('opp', pe.opp);
  }

  async function playAll() {
    if (playing) { ++runId; playing = false; syncButtons(); return; }
    playing = true; syncButtons();
    let start = overview || idx >= seq.length - 1 ? 0 : idx;
    for (let i = start; i < seq.length; i++) {
      const ok = await render(i, true);
      if (!ok || !playing) { playing = false; syncButtons(); return; }
      if (i < seq.length - 1) { const my = runId; await wait(900 * spd()); if (my !== runId) { playing = false; syncButtons(); return; } }
    }
    playing = false; syncButtons();
  }

  function stop() { ++runId; playing = false; }

  // ---------- 패널 ----------
  const card = document.getElementById('card');
  function branchHTML() {
    const bn = branchNode(seq);
    if (!bn) return '';
    const bi = seq.indexOf(bn);
    if (!overview && idx < bi) return '';
    const who = seq[bi + 1] ? `${seq[bi + 1].n}구` : '다음 구';
    return `<div class="branch">
      <h3>${who} 분기 · 상대 리턴 방향에 따라</h3>
      <div class="branch-opts">${bn.next.branches.map((b) => `
        <button type="button" class="branch-btn" data-branch="${esc(b.key)}" aria-pressed="${b.key === branchKey}">
          <b>${esc(b.key)}</b><span>${esc(b.label)}</span><small>${b.share != null ? `실전 비율 약 ${Math.round(b.share * 100)}%` : ''}</small>
        </button>`).join('')}
      </div></div>`;
  }
  function renderPanel() {
    if (overview) {
      card.innerHTML = `
        <div class="card-head"><div class="num wide">요약</div>
          <div class="head-text"><h2 class="title">${esc(TACTIC.title)}</h2></div></div>
        <section class="sec"><p>${esc(TACTIC.summary)}</p></section>
        <section class="sec"><h3>구 순서 · 분기 ${esc(branchKey)}</h3>
          <ol class="steps">${seq.map((s, i) => `<li><button type="button" data-step="${i}"><b>${s.n}구</b><span>${esc(s.title)}</span><span class="who ${s.actor}">${s.actor === 'me' ? '나' : '상대'}</span></button></li>`).join('')}</ol>
        </section>
        ${branchHTML()}`;
    } else {
      const s = seq[idx];
      const e = s.explain || {};
      const keysLabel = s.actor === 'me' ? '체크포인트' : '읽기 포인트';
      card.innerHTML = `
        <div class="card-head"><div class="num">${s.n}구</div>
          <div class="head-text">
            <span class="actor ${s.actor}">${s.actor === 'me' ? '나' : '상대'}</span>
            <h2 class="title">${esc(s.title)}</h2>
          </div></div>
        <dl class="facts">
          <div><dt>스트로크</dt><dd>${esc(s.stroke)}</dd></div>
          <div><dt>회전</dt><dd>${esc(s.spin.join(' / '))}</dd></div>
          <div><dt>길이</dt><dd>${esc(s.length)}</dd></div>
          <div><dt>코스</dt><dd>${esc(s.target)}</dd></div>
          ${s.footwork ? `<div><dt>풋워크</dt><dd>${esc(s.footwork.label || s.footwork.type)}</dd></div>` : ''}
        </dl>
        ${e.what ? `<section class="sec"><h3>무엇을</h3><p>${esc(e.what)}</p></section>` : ''}
        ${e.why ? `<section class="sec"><h3>왜</h3><p>${esc(e.why)}</p></section>` : ''}
        ${e.keys && e.keys.length ? `<section class="sec"><h3>${keysLabel}</h3><ul>${e.keys.map((k) => `<li>${esc(k)}</li>`).join('')}</ul></section>` : ''}
        ${e.mistakes && e.mistakes.length ? `<section class="sec"><h3>흔한 실수</h3><ul>${e.mistakes.map((k) => `<li>${esc(k)}</li>`).join('')}</ul></section>` : ''}
        ${branchHTML()}
        <details><summary>이 구의 데이터 (JSON)</summary><pre>${esc(JSON.stringify(s, null, 2))}</pre></details>`;
    }
    card.querySelectorAll('[data-branch]').forEach((b) => b.addEventListener('click', () => setBranch(b.dataset.branch)));
    card.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => { stop(); render(parseInt(b.dataset.step, 10), true); }));
  }

  const stepper = document.getElementById('stepper');
  function renderStepper() {
    stepper.innerHTML = seq.map((s, i) => `<button type="button" class="step-btn" data-step="${i}" ${!overview && i === idx ? 'aria-current="step"' : ''}>
      <i class="dot" style="background: var(--${s.actor})"></i><b>${s.n}구</b><span>${esc(s.short)}</span></button>`).join('');
    stepper.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { stop(); render(parseInt(b.dataset.step, 10), true); }));
  }

  const btnPrev = document.getElementById('prev'), btnNext = document.getElementById('next'), btnPlay = document.getElementById('play'), btnOv = document.getElementById('overview');
  function syncButtons() {
    btnPlay.textContent = playing ? '일시정지' : '재생';
    btnPrev.disabled = !overview && idx === 0;
    btnNext.disabled = !overview && idx >= seq.length - 1;
    btnOv.setAttribute('aria-pressed', String(overview));
  }
  function setBranch(key) {
    if (key === branchKey) return;
    branchKey = key;
    const was = overview, at = idx;
    seq = buildSeq(branchKey);
    stop();
    if (was) renderOverview(); else render(Math.min(at, seq.length - 1), true);
  }

  btnPrev.addEventListener('click', () => { stop(); render(overview ? 0 : idx - 1, false); });
  btnNext.addEventListener('click', () => { stop(); render(overview ? 0 : idx + 1, true); });
  btnPlay.addEventListener('click', playAll);
  btnOv.addEventListener('click', () => { if (overview) { stop(); render(idx, false); } else renderOverview(); });
  document.addEventListener('keydown', (ev) => {
    if (ev.target && /^(select|input|textarea)$/i.test(ev.target.tagName)) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); if (!btnNext.disabled) btnNext.click(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); if (!btnPrev.disabled) btnPrev.click(); }
    else if (ev.key === ' ') { ev.preventDefault(); playAll(); }
  });

  // ---------- 헤더 ----------
  document.getElementById('tactic-title').textContent = TACTIC.title;
  document.title = 'TT Tactics 전술 보드';
  const hand = (h) => (h === 'L' ? '왼손' : '오른손');
  document.getElementById('tactic-chips').innerHTML = [
    TACTIC.category, TACTIC.level,
    `${hand(TACTIC.players.me.hand)} vs ${hand(TACTIC.players.opp.hand)}`,
    TACTIC.players.me.grip,
  ].concat(TACTIC.tags || []).filter(Boolean).map((c) => `<span class="chip">${esc(c)}</span>`).join('');

  // ---------- 시작 ----------
  drawFloor();
  makePlayer('me', '나');
  makePlayer('opp', '상대');
  render(0, false);
  // 웹폰트가 늦게 오면 배지 폭이 달라지므로 한 번 다시 그린다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!playing) { if (overview) renderOverview(); else render(idx, false); } });
})();
</script>
</body>
</html>
